# Project-scoped MCP configuration. Codex loads this only after the repository is trusted.
[mcp_servers.sci_workflow_os]
command = "uv"
args = ["run", "--frozen", "sciops-mcp"]
cwd = "."
env_vars = [
  "OPENALEX_API_KEY",
  "OPENALEX_EMAIL",
  "ZOTERO_LIBRARY_ID",
  "ZOTERO_LIBRARY_TYPE",
  "ZOTERO_API_KEY",
]
startup_timeout_sec = 20
tool_timeout_sec = 90
default_tools_approval_mode = "writes"

# Optional local code index. SETUP-CODEX installs it under .tools/ and this
# wrapper exits cleanly when it has not been installed yet.
[mcp_servers.codegraph]
command = "uv"
args = ["run", "--frozen", "python", "scripts/codegraph-mcp.py"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 90
default_tools_approval_mode = "approve"
enabled_tools = [
  "codegraph_explore",
]
