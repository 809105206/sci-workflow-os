# Project-scoped MCP configuration. Codex loads this only after the repository is trusted.
[mcp_servers.sci_workflow_os]
command = "uv"
args = ["run", "--frozen", "sciops-mcp"]
cwd = "."
env_vars = [
  "OPENALEX_API_KEY",
  "OPENALEX_EMAIL",
  "ZOTERO_LIBRARY_ID",
  "ZOTERO_LIBRARY_TYPE",
  "ZOTERO_API_KEY",
]
startup_timeout_sec = 20
tool_timeout_sec = 90
default_tools_approval_mode = "writes"
