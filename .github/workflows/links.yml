name: Check public links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-path _site
            --exclude 'https://www.fenqubiao.com/.*'
            --exclude 'https://earlywarning.fenqubiao.com/.*'
            '**/*.md' '**/*.qmd'
          fail: true
